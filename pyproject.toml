[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[project]
name = "riskmodel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Igor", email = "igor.misterowicz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.7",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
riskmodel = "riskmodel:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]
